name: VPN Gate subscription update
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gate-subscription
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: 检测节点并生成清单
        run: python vpngate.py
        env:
          CHECK_WORKER: https://vpngate-check-20261031.kaixuan16888.workers.dev/check?sstp=vpn:vpn@
          CHECK_KEY: ${{ secrets.CHECK_KEY }}
          CHECK_CONCURRENCY: "16"
          CHECK_TIMEOUT: "30"
          # 本机从 BestCF 候选列表抽样测速通过，网络变化后应重新测速
          HOSTS_ENTRY: "www.udacity.com:443,iili.io:443,staticdelivery.nexusmods.com:443,xn--b6gac.eu.org:443,icook.tw:443,openai.com:443,www.wto.org:443,t.213891.xyz:443,gateway.ipfsscan.io:443,missav.ws:443,upfile.live:443,cdn.nodeimage.com:443,www.ntu.edu.sg:443,api.uniapi.io:443,hashi.sbs:443,www.visa.com.hk:443,store.ubi.com:443,gitlab.com:443,singapore.com:443,flightradar24.com:443"
          OPTIMAL_API: ""
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
