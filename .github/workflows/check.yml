name: VPN Gate subscription update
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gate-subscription
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: 检测节点并生成清单
        run: python vpngate.py
        env:
          CHECK_WORKER: https://vpngate-check-20261031.kaixuan16888.workers.dev/check?sstp=vpn:vpn@
          CHECK_KEY: ${{ secrets.CHECK_KEY }}
          CHECK_CONCURRENCY: "16"
          CHECK_TIMEOUT: "30"
          HOSTS_ENTRY: "markmonitor.com:443,www.sage.com:443,egov.uscis.gov:443,spring.io:443,staticdelivery.nexusmods.com:443,www.gov.il:443,prizepicks.com:443,guide.for.edu.sg:443,www.carousell.sg:443,53.fs1.hubspotusercontent-na1.net:443,www.wto.org:443,constitution.congress.gov:443,funko.com:443,www.dbs.com.sg:443,jobsdb.com:443,www.dentoncounty.gov:443,www.sofi.com:443,www.broadcom.com:443,uspto.gov:443,www.zendesk.com:443"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
